# Reusable workflow: checks that .aicu/surface.yml exists and is valid.
#
# Call it from any repository (three lines):
#
#   jobs:
#     surface:
#       uses: aicuai/.github/.github/workflows/surface-manifest.yml@main
#
# Why:
#   A repository that serves a public host but declares nothing cannot be evaluated.
#   And when a resource is found unused, nobody can decide whether to delete it unless
#   an owner and a retirement condition are written down somewhere.
#
# GitHub Actions is free for public repositories; for private ones this is a check of a few seconds.
name: surface manifest

on:
  workflow_call:
    inputs:
      required:
        description: 'Require the manifest even if no public host is detected (use for Cloudflare Pages repositories)'
        required: false
        default: false
        type: boolean
      shared_hosts:
        description: 'Comma-separated hosts shared by several repositories; declaring one of them without paths produces a warning'
        required: false
        default: ''
        type: string
      tools_ref:
        description: 'Ref of aicuai/.github to take the validator from'
        required: false
        default: main
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Detect public hosts
        id: detect
        run: |
          # Read the repository's own config to see whether it intends to serve a public host.
          # Cloudflare Pages custom domains live in the dashboard, not in the repository;
          # the `required` input covers that case.
          HOSTS=""
          for f in wrangler.toml wrangler.jsonc wrangler.json; do
            [ -f "$f" ] || continue
            # Skip comment lines, so a host mentioned as "do not use" is not picked up.
            # Skip zone_name: it names a zone, not a served host. It sits next to
            # `pattern = "sub.example.com"`, and picking it up would attach the apex
            # to repositories that do not serve it.
            HOSTS="$HOSTS $(grep -vE '^\s*(#|//)' "$f" \
              | grep -vE 'zone_name' \
              | grep -E 'pattern|route|custom_domain' \
              | grep -oE '([a-z0-9-]+\.)+[a-z]{2,}' \
              | grep -vE '\.workers\.dev$' || true)"
          done
          for f in CNAME public/CNAME docs/CNAME; do
            [ -f "$f" ] && HOSTS="$HOSTS $(tr -d ' \n' < "$f")"
          done
          LIST=$(echo $HOSTS | tr ' ' '\n' | grep -E '\.' | sort -u | paste -sd, -)
          echo "hosts=$LIST" >> $GITHUB_OUTPUT
          if [ -n "$LIST" ]; then echo "has_surface=true" >> $GITHUB_OUTPUT; else echo "has_surface=false" >> $GITHUB_OUTPUT; fi
          echo "Detected hosts: ${LIST:-(none)}"

      - name: Check for the manifest
        id: exists
        run: |
          if [ -f .aicu/surface.yml ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail if a public host is served without a manifest
        if: steps.exists.outputs.found == 'false' && (steps.detect.outputs.has_surface == 'true' || inputs.required)
        run: |
          cat <<'MSG'
          ✗ This repository serves a public host but has no .aicu/surface.yml.

          Without an owner and a retirement condition, nobody can decide whether this
          surface may be removed once it stops being used. Create the file like this:

            # .aicu/surface.yml
            entity: inc           # inc | jp (separate companies; pick one)
            role: What this surface does, and for whom
            owner: "@AICUai"    # a handle or team alias, not a personal email
            hosts:
              - app.example.com
            deploy: cloudflare-workers
            status: live
            review:
              next: 2027-03-31                 # next review date
              retire_when: What ends this      # "Undecided (revisit 2027-03)" is fine

          Guide: https://github.com/aicuai/.github/blob/main/docs/surface-manifest.md
          MSG
          echo "Detected hosts: ${{ steps.detect.outputs.hosts }}"
          exit 1

      - name: Skip when there is neither a manifest nor a public host
        if: steps.exists.outputs.found == 'false' && steps.detect.outputs.has_surface != 'true' && !inputs.required
        run: |
          echo "No public host detected; skipping."
          echo "(Set with.required: true to require the manifest regardless.)"

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.found == 'true'
        with:
          node-version: '22'

      # Fetch the validator with checkout, not curl.
      # raw.githubusercontent.com only works for public repositories and would break silently if this one went private.
      - name: Fetch the validator
        if: steps.exists.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: aicuai/.github
          ref: ${{ inputs.tools_ref }}
          path: .aicu-ci

      - name: Validate
        if: steps.exists.outputs.found == 'true'
        run: |
          npx --yes js-yaml .aicu/surface.yml > /tmp/surface.json
          node .aicu-ci/scripts/validate-surface.mjs /tmp/surface.json \
            --wrangler-hosts "${{ steps.detect.outputs.hosts }}" \
            --shared-hosts "${{ inputs.shared_hosts }}"
