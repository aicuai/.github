# Runs this repository's own workflows on itself, using the scripts from the commit under test.
name: self test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  leak:
    uses: ./.github/workflows/leak-audit.yml
    with:
      tools_ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
  surface:
    uses: ./.github/workflows/surface-manifest.yml
    with:
      required: true
      tools_ref: ${{ github.event.pull_request.head.sha || github.sha }}
